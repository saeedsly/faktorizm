services:
  mysql:
    image: mysql:8.4
    container_name: faktorizm-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_persian_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-faktorizm}
      MYSQL_USER: ${MYSQL_USER:-faktorizm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-faktorizm_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # اسکیمای رسمی فقط در اولین راه‌اندازی دیتابیس اجرا می‌شود
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: faktorizm-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DB_DRIVER: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-faktorizm}
      MYSQL_USER: ${MYSQL_USER:-faktorizm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-faktorizm_change_me}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8787:8787"
    command: ["node", "server/src/index.js"]

volumes:
  mysql_data:
