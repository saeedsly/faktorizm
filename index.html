<!doctype html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="description" content="فاکتوریزم — سامانه هوشمند اسکن و استخراج خودکار فاکتور با بینایی ماشین، خروجی اکسل و API حسابداری" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>فاکتوریزم | سامانه هوشمند فاکتور</title>
    <style>
      #app-boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
        background:#0a0e1a;color:#e8ecf6;font-family:Tahoma,Segoe UI,sans-serif;padding:20px}
      #app-boot .b{max-width:560px;width:100%;background:#141a2c;border:1px solid #26304c;border-radius:18px;padding:30px;text-align:center}
      #app-boot .sp{width:42px;height:42px;border:4px solid #2c3656;border-top-color:#6d5efc;border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      #app-boot h1{font-size:18px;margin:0 0 8px}
      #app-boot p{font-size:13px;color:#9aa6c2;line-height:2;margin:6px 0}
      #app-boot pre{direction:ltr;text-align:left;background:#0c1120;border:1px solid #232c44;border-radius:10px;
        padding:12px;font-size:11px;line-height:1.7;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#f4a6a6}
      #app-boot code{direction:ltr;background:#0c1120;padding:2px 8px;border-radius:6px;color:#a5b4fc}
      #app-boot.hidden{display:none}
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-boot">
      <div class="b">
        <div class="sp" id="boot-spinner"></div>
        <h1 id="boot-title">در حال آماده‌سازی فاکتوریزم…</h1>
        <p id="boot-msg">لطفاً چند لحظه صبر کنید.</p>
      </div>
    </div>

    <script>
      /* پلی‌فیل Iterator Helpers برای مرورگرهای فاقد آن (مثل Firefox < 131) — باید قبل از باندل اجرا شود */
      (function () {
        var g = typeof globalThis !== 'undefined' ? globalThis : window;
        function getIterator(source) {
          if (source == null) throw new TypeError('bad iterator source');
          if (typeof source.next === 'function') return source;
          var fn = source[Symbol.iterator];
          if (typeof fn !== 'function') throw new TypeError('source is not iterable');
          return fn.call(source);
        }
        function wrap(next) { var it = Object.create(g.Iterator.prototype); it.next = next; return it; }
        if (typeof g.Iterator !== 'function' || typeof g.Iterator.prototype.map !== 'function') {
          function Iterator() {}
          Iterator.prototype[Symbol.iterator] = function () { return this; };
          Iterator.prototype.next = function () { throw new TypeError('bad iterator'); };
          Iterator.from = function (source) {
            var inner = getIterator(source);
            if (Object.getPrototypeOf(inner) === Iterator.prototype) return inner;
            return wrap(function () { return inner.next(); });
          };
          Iterator.prototype.map = function (fn) { var s = this, i = 0; return wrap(function () { var r = s.next(); return r.done ? r : { value: fn(r.value, i++), done: false }; }); };
          Iterator.prototype.filter = function (fn) { var s = this, i = 0; return wrap(function () { for (;;) { var r = s.next(); if (r.done) return r; if (fn(r.value, i++)) return r; } }); };
          Iterator.prototype.take = function (limit) { var s = this, n = 0; return wrap(function () { if (n >= limit) return { value: undefined, done: true }; n++; return s.next(); }); };
          Iterator.prototype.drop = function (limit) { var s = this, d = 0; return wrap(function () { while (d < limit) { d++; var r = s.next(); if (r.done) return r; } return s.next(); }); };
          Iterator.prototype.takeWhile = function (fn) { var s = this, i = 0, stop = false; return wrap(function () { if (stop) return { value: undefined, done: true }; var r = s.next(); if (r.done || !fn(r.value, i++)) { stop = true; return { value: undefined, done: true }; } return r; }); };
          Iterator.prototype.dropWhile = function (fn) { var s = this, i = 0, dropping = true; return wrap(function () { var r; while (dropping) { r = s.next(); if (r.done) return r; if (!fn(r.value, i++)) { dropping = false; return r; } } return s.next(); }); };
          Iterator.prototype.flatMap = function (fn) { var s = this, inner = null, i = 0; return wrap(function () { for (;;) { if (inner) { var r = inner.next(); if (!r.done) return r; inner = null; } var o = s.next(); if (o.done) return o; inner = getIterator(fn(o.value, i++)); } }); };
          Iterator.prototype.reduce = function (fn, acc) { var i = 0, r; if (arguments.length < 2) { r = this.next(); if (r.done) throw new TypeError('reduce of empty'); acc = r.value; i = 1; } for (;;) { r = this.next(); if (r.done) return acc; acc = fn(acc, r.value, i++); } };
          Iterator.prototype.toArray = function () { var out = []; for (;;) { var r = this.next(); if (r.done) return out; out.push(r.value); } };
          Iterator.prototype.forEach = function (fn) { var i = 0; for (;;) { var r = this.next(); if (r.done) return; fn(r.value, i++); } };
          Iterator.prototype.some = function (fn) { var i = 0; for (;;) { var r = this.next(); if (r.done) return false; if (fn(r.value, i++)) return true; } };
          Iterator.prototype.every = function (fn) { var i = 0; for (;;) { var r = this.next(); if (r.done) return true; if (!fn(r.value, i++)) return false; } };
          Iterator.prototype.find = function (fn) { var i = 0; for (;;) { var r = this.next(); if (r.done) return undefined; if (fn(r.value, i++)) return r.value; } };
          Iterator.prototype.findIndex = function (fn) { var i = 0; for (;;) { var r = this.next(); if (r.done) return -1; if (fn(r.value, i)) return i; i++; } };
          Iterator.prototype.includes = function (v) { for (;;) { var r = this.next(); if (r.done) return false; if (r.value === v) return true; } };
          Iterator.prototype.join = function (sep) { if (sep === undefined) sep = ','; return this.toArray().join(sep); };
          g.Iterator = Iterator;
        }
        if (typeof g.AsyncIterator !== 'function') {
          function AsyncIterator() {}
          AsyncIterator.prototype[Symbol.asyncIterator] = function () { return this; };
          AsyncIterator.prototype.next = function () { throw new TypeError('bad async iterator'); };
          AsyncIterator.from = function (source) { var inner = getIterator(source); var it = Object.create(AsyncIterator.prototype); it.next = function () { return Promise.resolve(inner.next()); }; return it; };
          AsyncIterator.prototype.toArray = function () { var self = this, out = []; return self.next().then(function loop(r) { if (r.done) return out; out.push(r.value); return self.next().then(loop); }); };
          g.AsyncIterator = AsyncIterator;
        }
      })();
    </script>

    <script>
      // این اسکریپت عمدا با سینتکس قدیمی (ES5) نوشته شده تا روی هر مرورگری اجرا شود
      (function () {
        var errors = [];
        var bundleFailed = false;
        function $(id) { return document.getElementById(id); }
        function showFail(title, detail) {
          var sp = $('boot-spinner'); if (sp) sp.style.display = 'none';
          $('boot-title').innerHTML = title;
          var msg = $('boot-msg');
          msg.innerHTML = 'مرورگر شما: <code>' + (navigator.userAgent || 'نامشخص') + '</code>';
          var pre = document.createElement('pre');
          pre.innerHTML = detail || (errors.length ? errors.join('\n') : 'جزئیات بیشتری در دسترس نیست.');
          msg.parentNode.appendChild(pre);
          var tip = document.createElement('p');
          tip.style.color = '#fbbf24';
          tip.innerHTML = 'راهنمای کلی: از مرورگر Chrome یا Firefox نسخه نسبتا جدید استفاده کنید و آدرس را با <code>http://</code> (نه https) و با اسلش انتهایی باز کنید، مثل <code>http://127.0.0.1/faktorizm/</code>';
          msg.parentNode.appendChild(tip);
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') { bundleFailed = true; errors.push('فایل اسکریپت لود نشد: ' + (t.src || 'نامشخص')); return; }
          if (t && t.tagName === 'LINK') { errors.push('فایل استایل لود نشد: ' + (t.href || 'نامشخص')); return; }
          var m = e.message || String(e.error || 'خطای ناشناخته');
          if (e.filename) { m += '  @ ' + e.filename + (e.lineno ? ':' + e.lineno : ''); }
          errors.push(m);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason; errors.push('Promise: ' + (r && r.message ? r.message : String(r)));
        });
        // ناظر: اگر تا ۱۰ ثانیه بعد React رندر نشد، یعنی باندل لود/اجرا نشده
        setTimeout(function () {
          var root = $('root');
          if (!root || root.children.length === 0) {
            if (bundleFailed) {
              showFail('فایل اصلی برنامه پیدا نشد (خطای ۴۰۴)',
                'فایل جاوااسکریپت از مسیر درست خوانده نشد.\nمحتمل‌ترین علت: آدرس بدون اسلش انتهایی یا کپی اشتباه پوشه.\nمطمئن شوید این فایل وجود دارد:\nC:\\xampp\\htdocs\\faktorizm\\index.html\nو آدرس را دقیقا به این شکل باز کنید:\nhttp://127.0.0.1/faktorizm/\n\n' + errors.join('\n'));
            } else {
              showFail('برنامه اجرا نشد', errors.length ? errors.join('\n') : 'مرورگر ممکن است خیلی قدیمی باشد یا جاوااسکریپت غیرفعال باشد.');
            }
          }
        }, 10000);
        window.__markBundleFail = function () { bundleFailed = true; };
        window.__hideBoot = function () { var b = $('app-boot'); if (b) b.className = 'hidden'; };
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__markBundleFail && window.__markBundleFail()"></script>
  </body>
</html>
